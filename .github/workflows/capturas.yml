name: Capturas de pantalla

on:
  push:
    branches: [ capturas ]

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)" app-debug.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador y capturas
        run: |
          mkdir -p capturas
          exec > >(tee capturas/emulador.txt) 2>&1
          set -x
          export SDK="$ANDROID_HOME"
          SM=$(ls $SDK/cmdline-tools/latest/bin/sdkmanager 2>/dev/null || ls $SDK/cmdline-tools/*/bin/sdkmanager | head -n1)
          AVD=$(dirname "$SM")/avdmanager
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "emulator" "platform-tools" "system-images;android-34;google_apis;x86_64" > /dev/null
          export ANDROID_AVD_HOME="$HOME/.android/avd"; mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVD" create avd -n test -k "system-images;android-34;google_apis;x86_64" -d pixel_6 --force -p "$ANDROID_AVD_HOME/test.avd"
          printf 'avd.ini.encoding=UTF-8\npath=%s/test.avd\ntarget=android-34\n' "$ANDROID_AVD_HOME" > "$ANDROID_AVD_HOME/test.ini"
          emulator -list-avds || "$SDK/emulator/emulator" -list-avds
          export PATH="$SDK/emulator:$SDK/platform-tools:$PATH"
          ls -la /dev/kvm || true
          nohup emulator -avd test -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -memory 4096 > capturas/emulator-proc.txt 2>&1 &
          timeout 600 adb wait-for-device || { cat capturas/emulator-proc.txt; exit 1; }
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 5
          done
          adb shell getprop sys.boot_completed
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          timeout 1800 bash tools/capturas/todo.sh || true
          cat capturas/log.txt || true
      - name: Empaquetar
        if: always()
        run: |
          mkdir -p capturas
          ls -la . > capturas/workspace.txt
          ls -la app-debug.apk >> capturas/workspace.txt 2>&1 || true
          zip -qr capturas.zip capturas
      - name: Publicar capturas
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: capturas-${{ github.run_number }}
          name: Capturas ${{ github.run_number }}
          prerelease: true
          files: capturas.zip
