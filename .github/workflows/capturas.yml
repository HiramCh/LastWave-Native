name: Capturas de pantalla

on:
  push:
    branches: [ capturas ]

permissions:
  contents: write

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Compilar APK debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp "$(find app/build/outputs/apk/debug -name '*.apk' | head -n1)" app-debug.apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulador y capturas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            bash tools/capturas/capturar.sh normal app-debug.apk capturas || true
            adb shell wm size 720x1440 && adb shell wm density 360 && sleep 3
            bash tools/capturas/capturar.sh pequeno app-debug.apk capturas || true
            adb shell wm size reset && adb shell wm density reset
      - name: Empaquetar
        run: |
          ls capturas | head -100
          zip -qr capturas.zip capturas
      - name: Publicar capturas
        uses: softprops/action-gh-release@v2
        with:
          tag_name: capturas-${{ github.run_number }}
          name: Capturas ${{ github.run_number }}
          prerelease: true
          files: capturas.zip
